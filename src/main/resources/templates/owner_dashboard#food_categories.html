<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/owner_dashboard_layout}" xmlns="http://www.w3.org/1999/html">

<head>
    <title>Meet your meal</title>
</head>

<body>
    <div layout:fragment="content">

        <div class="table-responsive">
            <div class="table-wrapper">
                <div class="table-title">
                    <div class="row">
                        <div class="col-sm-8"><h2><b>Food categories</b></h2></div>
                        <div class="col-sm-4">
                            <a th:href="@{/owner-dashboard/food-categories/add}" class="btn btn-info add-new"> Add New</a>
                        </div>
                    </div>
                </div>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="foodCategory : ${foodCategoryDTOs}">
                            <td th:text="${foodCategory.category}"></td>
                            <td>
                                <form
                                        th:action="@{/owner-dashboard/food-categories/delete/{id}(id=${foodCategory.foodCategoryId})}"
                                        th:method="DELETE">
                                    <button class="btn" title="Delete" data-toggle="tooltip">
                                        <i class="material-icons">&#xE872;</i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </div>
</body>

</html>
