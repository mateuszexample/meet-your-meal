<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/owner_dashboard_layout}" xmlns="http://www.w3.org/1999/html">

<head>
    <title>Meet your meal</title>
</head>

<body>
    <div layout:fragment="content">

        <div class="table-responsive">
            <div class="table-wrapper">
                <div class="table-title">
                    <div class="row">
                        <div class="col-sm-8"><h2><b>Food categories</b></h2></div>
                        <div class="col-sm-4">
                            <a th:href="@{/owner-dashboard/food-categories/add}" class="btn btn-info add-new">Add category</a>
                        </div>
                    </div>
                </div>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="foodCategory : ${foodCategoryDTOs}">
                            <td th:text="${foodCategory.category}"></td>
                            <td>
                                <button class="btn" title="Delete" data-toggle="tooltip"
                                        data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${foodCategory.foodCategoryId}">
                                    <i class="material-icons">&#xE872;</i>
                                </button>
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

        <div th:each="foodCategory : ${foodCategoryDTOs}" class="modal fade" th:id="'deleteModal' + ${foodCategory.foodCategoryId}"
             tabindex="-1" th:aria-labelledby="'deleteModalLabel' + ${foodCategory.foodCategoryId}" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" th:id="'deleteModalLabel' + ${foodCategory.foodCategoryId}">Confirm Deletion</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this category? <b>This action will also delete all items in this category and cannot be undone.</b>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <form th:action="@{/owner-dashboard/food-categories/delete/{id}(id=${foodCategory.foodCategoryId})}"
                              th:method="DELETE">
                            <button type="submit" class="btn btn-danger">Delete Category</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
