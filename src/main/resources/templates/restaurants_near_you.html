<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/base_layout}">

<head>
    <title>Meet your meal</title>
</head>

<body>

<div layout:fragment="contentHero">

    <div id="containerRestaurants">

        <h2>There are x restaurants near You!</h2>

        <div>
            <div th:each="restaurant : ${restaurantDTOs}">

                <a th:href="@{'/restaurant-details/' + ${restaurant.name}}" class="card m-2" id="restaurantCard">
                    <div class="row g-0">
                        <div class="col-md-4">
                            <img th:if="${restaurant.hasImage}"
                                 th:src="@{search-for-restaurants/image/{name}(name=${restaurant.name})}"
                                 class="img-fluid rounded-start"
                                 alt="Restaurant image"/>
                            <span th:unless="${restaurant.hasImage}">No image</span>
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${restaurant.name}"></h5>
                                <p class="card-text">
                                    This is a wider card with supporting text below as a natural lead-in to additional
                                    content. This content is a little bit longer.
                                </p>
                                <p class="card-text">
                                    <small class="text-muted">Last updated 3 mins ago</small>
                                </p>
                            </div>
                        </div>
                    </div>
                </a>

            </div>
        </div>

    </div>
</div>

</body>

</html>
