<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/owner_dashboard_layout}" xmlns="http://www.w3.org/1999/html">

<head>
    <title>Meet your meal</title>
</head>

<body>
    <div layout:fragment="content">

        <div class="table-responsive">
            <div class="table-wrapper">
                <div class="table-title">
                    <div class="row">
                        <div class="col-sm-8"><h2><b>Menu</b></h2></div>
                        <div class="col-sm-4">
                            <a th:href="@{/owner-dashboard/menu/add}" class="btn btn-info add-new">Add food</a>
                        </div>
                    </div>
                </div>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Image</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="food : ${foodDTOs}">
                            <td th:text="${food.name}"></td>
                            <td th:text="${food.description}"></td>
                            <td th:text="${food.price}"></td>
                            <td>
                                <img th:if="${food.hasImage}"
                                     th:src="@{menu/image/{id}(id=${food.foodId})}"
                                     alt="Food Image"
                                     style="max-width: 100px; max-height: 100px;">
                                <span th:unless="${food.hasImage}">No image</span>
                            </td>
                            <td>
                                <form
                                        th:action="@{/owner-dashboard/menu/delete/{id}(id=${food.foodId})}"
                                        th:method="DELETE">
                                    <button class="btn" title="Delete" data-toggle="tooltip">
                                        <i class="material-icons">&#xE872;</i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </div>
</body>

</html>
