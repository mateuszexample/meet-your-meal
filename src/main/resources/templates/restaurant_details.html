<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/base_layout}">

<head>
    <title>Meet your meal</title>
</head>

<body>

<div layout:fragment="contentHero">

    <div id="containerRestaurantDetails">

        <div class="card">
            <img th:if="${restaurantDTO.hasImage}"
                 th:src="@{image/{name}(name=${restaurantDTO.name})}"
                 class="img-fluid rounded-start"
                 alt="Restaurant image"/>
            <span th:unless="${restaurantDTO.hasImage}">No image</span>
        </div>
            <div class="card-body">
                <h5 class="card-title" th:text="${restaurantDTO.name}"></h5>
                <p class="card-text">
                    Some quick example text to build on the card
                    title and make up the bulk of the card's content.
                </p>
                <a href="#" class="btn btn-primary">Go Somewhere</a>
            </div>
        </div>

    </div>
</div>

</body>

</html>
