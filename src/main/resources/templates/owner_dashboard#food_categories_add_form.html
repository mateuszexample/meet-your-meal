<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/owner_dashboard_layout}">

<head>
    <title>Meet your meal</title>
</head>

<body>
    <div layout:fragment="content">

        <div class="card" style="border-radius: 1rem;">
            <div class="card-body p-4">

                <h1 class="mb-4 text-center">Add food Category</h1>

                <form action="#" th:action="@{/owner-dashboard/food-categories/add}" method="POST" th:object="${foodCategoryRequestDTO}">
                    <!-- Text input -->
                    <div class="form-outline mb-4">
                        <input type="text" id="category" th:field="*{category}" class="form-control" placeholder="Category"/>
                    </div>
                    <!-- Submit button -->
                    <button type="submit" class="btn btn-secondary btn-rounded btn-block">Confirm</button>
                </form>

            </div>
        </div>

    </div>
</body>

</html>
