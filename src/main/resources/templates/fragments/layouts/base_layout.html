<!DOCTYPE HTML>
<html   lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title layout:title-pattern="$CONTENT_TITLE"></title>

    <link rel="stylesheet" type="text/css" href="" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/js/custom.min.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>

<body>
    <div id="wrapper">
        <div id="header">
            <!--    <header>-->
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg fixed-top">
                <div class="container-fluid">

                    <a th:href="@{/}" class="navbar-brand me-auto">meet your meal</a>

                    <a sec:authorize="!isAuthenticated()" class="login-button" th:href="@{/login}">Login</a>

                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: #009970;">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a sec:authorize="hasAuthority('CUSTOMER')" class="dropdown-item" th:href="@{/customer-dashboard}">Dashboard</a>
                                <a sec:authorize="!hasAuthority('CUSTOMER')" class="dropdown-item" th:href="@{/owner-dashboard}">Dashboard</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/logout}">Log out</a></li>
                        </ul>
                    </div>

                </div>
            </nav>
            <!-- End Navbar -->
            <!--    </header>-->
        </div>
        <div id="main">

            <div id="containerHero" layout:fragment="contentHero">

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>

</body>
</html>
