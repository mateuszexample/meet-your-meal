<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layouts/owner_dashboard_layout}">

<head>
    <title>Meet your meal</title>
</head>

<body>
    <div layout:fragment="content">

                <h1 class="mb-4 text-center">Add food to menu</h1>

                <form action="#" th:action="@{/owner-dashboard/menu/add}" method="POST" th:object="${foodRequestDTO}" enctype="multipart/form-data">
                    <!-- Text input -->
                    <div class="form-outline mb-4">
                        <label class="visually-hidden" for="category">Category</label>
                        <select required class="form-select" id="category" th:field="*{category}">
                            <option value="">Category</option>
                            <option th:each="availableCategory : ${availableFoodCategoryDTOs}" th:value="${availableCategory}" th:text="${availableCategory}"></option>
                        </select>
                    </div>
                    <!-- Text input -->
                    <div class="form-outline mb-4">
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Name" required/>
                    </div>
                    <!-- Text input -->
                    <div class="form-outline mb-4">
                        <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="Description" required/>
                    </div>
                    <!-- Text input -->
                    <div class="form-outline mb-4">
                        <input type="text" id="price" th:field="*{price}" class="form-control" placeholder="Price" required/>
                    </div>
                    <!-- Text input -->
                    <div class="form-outline mb-4">
                        <label for="image">Food Image</label>
                        <input type="file" id="image" name="image" class="form-control" accept="image/*"/>
                    </div>
                    <!-- Submit button -->
                    <button type="submit" class="btn btn-secondary btn-rounded btn-block">Confirm</button>
                </form>

            </div>
        </div>

    </div>
</body>

</html>
